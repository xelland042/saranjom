[project]
name = "open-erp"
version = "0.1.0"
description = ""
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy[asyncio] (>=2.0.45,<3.0.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.66b2,<0.67)",
    "opentelemetry-api (>=1.45.2,<2.0.0)",
    "opentelemetry-sdk (>=1.45.2,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-grpc (>=1.45.2,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.66b2,<0.67)",
    "openpyxl (>=3.1.5,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "coverage[toml] (>=7,<8)",
    "ruff (>=0,<1)",
    "pip-audit (>=2.10,<3)"
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
# what the backend tests reach: `coverage run -m unittest discover -s app/tests -t .`, then
# `coverage report`. Branches count, so an untested `else` shows.
[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs queries in greenlets: without this, code after an await is missed
concurrency = ["greenlet", "thread"]
omit = ["app/tests/*", "app/alembic/*", "app/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# a linter for real mistakes, not style (black formats): F = pyflakes (undefined names, unused
# imports and variables), B = bugbear (likely bugs: mutable defaults, loop variables in closures)
[tool.ruff]
target-version = "py312"
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["F", "B"]
